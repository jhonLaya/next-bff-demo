name: Build + Push Docker image (Docker Hub)

on:
  push:
    branches: ["main"]

jobs:
  dockerhub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Login Docker Hub (docker CLI)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get Docker Hub JWT (for API)
        env:
          USER: ${{ secrets.DOCKER_USERNAME }}
          PASSWD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          TOKEN=$(curl -sS -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$USER\",\"password\":\"$PASSWD\"}" | jq -r .token)
          echo "DH_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Delete :latest tag if exists (Docker Hub)
        env:
          USER: ${{ secrets.DOCKER_USERNAME }}
          REPO: ${{ secrets.DOCKER_REPO }}
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            -X DELETE \
            -H "Authorization: JWT $DH_TOKEN" \
            "https://hub.docker.com/v2/repositories/$USER/$REPO/tags/latest/" \
          || true

      - name: Build
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}
        run: |
          docker build -t $IMAGE:latest .

      - name: Push
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}
        run: |
          docker push $IMAGE:latest

      - name: Call webhook on success
        if: success()
        run: |
          curl -X POST "https://webhook.site/698aa498-1516-4ee1-bb34-56dcd010b4f1"
